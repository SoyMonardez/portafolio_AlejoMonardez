# =====================================================================
# Nginx del container frontend
# - Sirve el bundle estático de Vite
# - Proxea /api/* al backend Node (container "backend:3000")
# - Proxea /ai/*  al ai-service     (container "ai-service:3001")
# - Sirve /uploads/* desde el volumen compartido
# - SPA fallback: cualquier ruta SPA cae en index.html
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    # www -> apex: evita contenido duplicado/dilución de indexación entre hosts.
    # $host refleja el Host original que reenvía Nginx Proxy Manager.
    if ($host = www.alejomonardez.com) {
        return 301 https://alejomonardez.com$request_uri;
    }

    # Cabeceras de seguridad para el contenido servido por este Nginx.
    # (No incluimos CSP para no romper el bundle de Vite; el resto es seguro.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # gzip (fallback universal)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # brotli (mejor ratio que gzip; los navegadores que no lo soportan caen a gzip solos)
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache largo para assets con hash de Vite
    # (^~: gana a las location regex de abajo — acá el cache es 1y immutable)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Estáticos de public/ sin hash (retrato del hero, favicon, CV, og-image):
    # cache moderado — hoy salían sin Cache-Control y se re-pedían en cada visita.
    location ~* \.(avif|webp|png|jpg|jpeg|ico|svg|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # AI service
    location /ai/ {
        proxy_pass http://ai-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Uploads — sirve archivos desde el volumen compartido
    # (^~: sin esto, la location regex de imágenes ganaría y rompería el alias)
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Archivos subidos por el usuario: que el browser nunca los reinterprete.
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Rutas válidas de la SPA (client-side routing de React Router) — sirven index.html.
    # Cualquier otra ruta no-archivo cae en un 404 real (evita soft-404s indexables).
    location ~ ^/(proyectos(?:/[a-z0-9-]+)?|projects|servicios|sobre-mi|contacto|admin|dashboard)/?$ {
        try_files $uri $uri/index.html /index.html;
    }

    location / {
        try_files $uri $uri/ @notfound;
    }

    location @notfound {
        return 404;
    }

    # Health check del nginx en sí
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}


